<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Админ-панель — Багира</title>


  <style>
    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 20px;

      font-family: Arial, sans-serif;

      background: #f5f5f5;

      color: #333;
    }


    .container {
      max-width: 900px;
      margin: 0 auto;
    }


    h1 {
      text-align: center;
      margin-bottom: 25px;
    }


    /* =========================
       ДАТА
    ========================= */

    .date-panel {

      background: white;

      padding: 15px;

      border-radius: 12px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08);

      margin-bottom: 20px;
    }


    .date-buttons {

      display: flex;

      gap: 10px;

      align-items: center;

      justify-content: center;

      margin-bottom: 15px;
    }


    .date-buttons button {

      border: none;

      border-radius: 8px;

      padding: 10px 16px;

      font-size: 15px;

      cursor: pointer;

      background: #333;

      color: white;
    }


    .date-buttons button:hover {
      background: #555;
    }


    .today-button {
      background: #5cb85c !important;
    }


    .today-button:hover {
      background: #4cae4c !important;
    }


    .date-input {

      display: block;

      width: 100%;

      max-width: 250px;

      margin: 0 auto;

      padding: 10px;

      border: 1px solid #ccc;

      border-radius: 8px;

      font-size: 16px;
    }


    /* =========================
       ОБНОВИТЬ
    ========================= */

    .refresh-container {

      text-align: center;

      margin-bottom: 20px;
    }


    .refresh-button {

      background: #333;

      color: white;

      border: none;

      border-radius: 8px;

      padding: 11px 20px;

      cursor: pointer;

      font-size: 15px;
    }


    .refresh-button:hover {
      background: #555;
    }


    /* =========================
       СТАТИСТИКА
    ========================= */

    .summary {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;

      margin-bottom: 25px;
    }


    .summary-box {

      background: white;

      border-radius: 12px;

      padding: 18px;

      text-align: center;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08);
    }


    .summary-number {

      display: block;

      font-size: 30px;

      font-weight: bold;

      margin-bottom: 5px;
    }


    .summary-title {

      font-size: 14px;

      color: #777;
    }


    .summary-active .summary-number {
      color: #4caf50;
    }


    .summary-free .summary-number {
      color: #d4a000;
    }


    .summary-cancelled .summary-number {
      color: #d9534f;
    }


    /* =========================
       ДЕНЬ
    ========================= */

    .day-title {

      background: #333;

      color: white;

      padding: 15px 18px;

      border-radius: 10px;

      margin-bottom: 15px;

      font-size: 18px;

      text-align: center;
    }


    /* =========================
       СПИСОК
    ========================= */

    .booking-list {

      display: flex;

      flex-direction: column;

      gap: 12px;
    }


    /* =========================
       КАРТОЧКА
    ========================= */

    .booking {

      background: white;

      border-radius: 12px;

      padding: 18px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08);
    }


    /* =========================
       АКТИВНАЯ
    ========================= */

    .booking.active-booking {

      background: #f1fff1;

      border-left:
        5px solid #5cb85c;
    }


    .booking-time {

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 10px;
    }


    .booking-info {
      line-height: 1.7;
    }


    .booking-info strong {

      display: inline-block;

      min-width: 100px;
    }


    /* =========================
       ОТМЕНЁННАЯ
    ========================= */

    .cancelled-booking {

      background: #fff5f5;

      border-left:
        5px solid #d9534f;
    }


    .cancelled {

      color: #d9534f;

      font-weight: bold;

      margin-bottom: 12px;
    }


    /* =========================
       СВОБОДНАЯ
    ========================= */

    .free-booking {

      border:
        2px dashed #d4a000;

      background: #fffbea;

      box-shadow: none;
    }


    .free {

      color: #d4a000;

      font-weight: bold;

      margin-bottom: 12px;
    }


    /* =========================
       КНОПКА ДОБАВЛЕНИЯ
    ========================= */

    .add-booking-button {

      border: none;

      border-radius: 8px;

      padding: 10px 16px;

      background: #5cb85c;

      color: white;

      font-size: 15px;

      cursor: pointer;

      margin-top: 5px;
    }


    .add-booking-button:hover {
      background: #4cae4c;
    }


    /* =========================
       КНОПКА ОТМЕНЫ
    ========================= */

    .cancel-button {

      margin-top: 15px;

      background: #d9534f;

      color: white;

      border: none;

      border-radius: 8px;

      padding: 10px 15px;

      cursor: pointer;

      font-size: 15px;
    }


    .cancel-button:hover {
      background: #c9302c;
    }


    /* =========================
       ЗАГРУЗКА
    ========================= */

    .loading {

      background: white;

      padding: 30px;

      text-align: center;

      border-radius: 12px;

      color: #777;
    }


    /* =========================
       ОШИБКА
    ========================= */

    .error {

      background: #fff0f0;

      color: #c00;

      border:
        1px solid #e5aaaa;

      border-radius: 10px;

      padding: 15px;

      margin-bottom: 20px;
    }


    /* =========================
       MODAL
    ========================= */

    .modal {

      position: fixed;

      inset: 0;

      background:
        rgba(0, 0, 0, 0.55);

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      z-index: 1000;
    }


    .modal.active {
      display: flex;
    }


    .modal-content {

      width: 100%;

      max-width: 500px;

      max-height: 90vh;

      overflow-y: auto;

      background: white;

      border-radius: 15px;

      padding: 25px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.25);
    }


    .modal-title {

      margin-top: 0;

      margin-bottom: 20px;

      text-align: center;
    }


    .modal-row {

      margin-bottom: 15px;
    }


    .modal-row label {

      display: block;

      margin-bottom: 6px;

      font-weight: bold;
    }


    .modal-row input,
    .modal-row select,
    .modal-row textarea {

      width: 100%;

      padding: 11px;

      border:
        1px solid #ccc;

      border-radius: 8px;

      font-size: 16px;

      font-family: inherit;
    }


    .modal-row textarea {

      min-height: 80px;

      resize: vertical;
    }


    .modal-actions {

      display: flex;

      gap: 10px;

      margin-top: 20px;
    }


    .modal-actions button {

      flex: 1;

      padding: 12px;

      border: none;

      border-radius: 8px;

      font-size: 15px;

      cursor: pointer;
    }


    .modal-cancel {

      background: #ddd;

      color: #333;
    }


    .modal-save {

      background: #5cb85c;

      color: white;
    }


    .modal-save:hover {
      background: #4cae4c;
    }


    .modal-error {

      display: none;

      background: #fff0f0;

      color: #c00;

      border:
        1px solid #e5aaaa;

      padding: 10px;

      border-radius: 8px;

      margin-top: 10px;
    }


    /* =========================
       МОБИЛЬНАЯ ВЕРСИЯ
    ========================= */

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }


      h1 {
        font-size: 24px;
      }


      .summary {

        grid-template-columns:
          1fr;
      }


      .date-buttons {

        flex-wrap: wrap;
      }


      .date-buttons button {

        flex: 1;
      }


      .booking-info strong {

        display: block;
      }

    }
  </style>


  <!-- PWA БАГИРА -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Багира Админ">

  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

</head>


<body>


  <div class="container">


    <h1>
      🖥 Админ-панель «Багира»
    </h1>


    <!-- =========================
       ДАТА
  ========================== -->

    <div class="date-panel">


      <div class="date-buttons">


        <button id="previousDayButton">
          ← Предыдущий день
        </button>


        <button id="todayButton" class="today-button">
          Сегодня
        </button>


        <button id="nextDayButton">
          Следующий день →
        </button>


      </div>


      <input type="date" id="selectedDate" class="date-input">


    </div>


    <!-- =========================
       ОБНОВИТЬ
  ========================== -->

    <div class="refresh-container">

      <button id="refreshButton" class="refresh-button">
        🔄 Обновить записи
      </button>

    </div>


    <!-- =========================
       СТАТИСТИКА
  ========================== -->

    <div class="summary">


      <div class="summary-box summary-active">

        <span class="summary-number" id="activeCount">
          0
        </span>

        <span class="summary-title">
          Активных записей
        </span>

      </div>


      <div class="summary-box summary-free">

        <span class="summary-number" id="freeCount">
          0
        </span>

        <span class="summary-title">
          Свободных мест
        </span>

      </div>


      <div class="summary-box summary-cancelled">

        <span class="summary-number" id="cancelledCount">
          0
        </span>

        <span class="summary-title">
          Отменённых
        </span>

      </div>


    </div>


    <!-- =========================
       ОШИБКА
  ========================== -->

    <div id="error" class="error" style="display:none;"></div>


    <!-- =========================
       ЗАПИСИ
  ========================== -->

    <div id="bookingsContainer"></div>


  </div>



  <!-- =====================================================
     MODAL НОВОЙ ЗАПИСИ
===================================================== -->

  <div class="modal" id="bookingModal">


    <div class="modal-content">


      <h2 class="modal-title">
        ➕ Новая запись
      </h2>


      <!-- ДАТА -->

      <div class="modal-row">

        <label>
          Дата
        </label>

        <input type="date" id="bookingDate">

      </div>


      <!-- ВРЕМЯ -->

      <div class="modal-row">

        <label>
          Время
        </label>

        <select id="bookingTime">

          <option value="">
            Выберите время
          </option>

        </select>

      </div>


      <!-- ИМЯ -->

      <div class="modal-row">

        <label>
          Имя клиента
        </label>

        <input type="text" id="bookingName" placeholder="Введите имя">

      </div>


      <!-- ТЕЛЕФОН -->

      <div class="modal-row">

        <label>
          Телефон
        </label>

        <input type="tel" id="bookingPhone" placeholder="+375 (XX) XXX-XX-XX">

      </div>


      <!-- TELEGRAM -->

      <div class="modal-row">

        <label>
          Telegram
        </label>

        <input type="text" id="bookingTelegram" placeholder="@username">

      </div>


      <!-- УСЛУГА -->

      <div class="modal-row">

        <label>
          Услуга
        </label>

        <select id="bookingService">

          <option value="">
            Выберите услугу
          </option>

          <option value="Маникюр">
            Маникюр
          </option>

          <option value="Педикюр">
            Педикюр
          </option>

          <option value="Депиляция">
            Депиляция
          </option>

        </select>

      </div>


      <!-- КОММЕНТАРИЙ -->

      <div class="modal-row">

        <label>
          Комментарий
        </label>

        <textarea id="bookingComment" placeholder="Комментарий"></textarea>

      </div>


      <!-- ОШИБКА -->

      <div id="modalError" class="modal-error"></div>


      <!-- КНОПКИ -->

      <div class="modal-actions">

        <button type="button" class="modal-cancel" id="closeModalButton">
          Отмена
        </button>


        <button type="button" class="modal-save" id="saveBookingButton">
          Создать запись
        </button>

      </div>


    </div>

  </div>



  <script>


    /* =====================================================
       URL GOOGLE APPS SCRIPT
    ===================================================== */

    const GOOGLE_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbx5bk4gWQXRvXjFo8METowWbFTQYh_4AjuyW4TGqEBg7FCzL2WLGICpwerhu0iGvt-C/exec";


    /* =====================================================
       РАБОЧЕЕ ВРЕМЯ
    ===================================================== */

    const WORK_TIMES = [

      "10:00",
      "11:00",
      "12:00",
      "13:00",
      "14:00",
      "15:00",
      "16:00",
      "17:00",
      "18:00"

    ];


    /* =====================================================
       ЭЛЕМЕНТЫ
    ===================================================== */

    const selectedDate =
      document.getElementById(
        "selectedDate"
      );


    const previousDayButton =
      document.getElementById(
        "previousDayButton"
      );


    const todayButton =
      document.getElementById(
        "todayButton"
      );


    const nextDayButton =
      document.getElementById(
        "nextDayButton"
      );


    const refreshButton =
      document.getElementById(
        "refreshButton"
      );


    const bookingsContainer =
      document.getElementById(
        "bookingsContainer"
      );


    const activeCount =
      document.getElementById(
        "activeCount"
      );


    const freeCount =
      document.getElementById(
        "freeCount"
      );


    const cancelledCount =
      document.getElementById(
        "cancelledCount"
      );


    const errorElement =
      document.getElementById(
        "error"
      );


    /* =====================================================
       MODAL
    ===================================================== */

    const bookingModal =
      document.getElementById(
        "bookingModal"
      );


    const bookingDate =
      document.getElementById(
        "bookingDate"
      );


    const bookingTime =
      document.getElementById(
        "bookingTime"
      );


    const bookingName =
      document.getElementById(
        "bookingName"
      );


    const bookingPhone =
      document.getElementById(
        "bookingPhone"
      );


    const bookingTelegram =
      document.getElementById(
        "bookingTelegram"
      );


    const bookingService =
      document.getElementById(
        "bookingService"
      );


    const bookingComment =
      document.getElementById(
        "bookingComment"
      );


    const modalError =
      document.getElementById(
        "modalError"
      );


    const closeModalButton =
      document.getElementById(
        "closeModalButton"
      );


    const saveBookingButton =
      document.getElementById(
        "saveBookingButton"
      );


    /* =====================================================
       СЕГОДНЯ
    ===================================================== */

    function getTodayString() {

      const today =
        new Date();


      const year =
        today.getFullYear();


      const month =
        String(
          today.getMonth() + 1
        ).padStart(2, "0");


      const day =
        String(
          today.getDate()
        ).padStart(2, "0");


      return `${year}-${month}-${day}`;

    }


    /* =====================================================
       УСТАНОВИТЬ СЕГОДНЯ
    ===================================================== */

    function setToday() {

      selectedDate.value =
        getTodayString();

    }


    /* =====================================================
       ИЗМЕНИТЬ ДАТУ
    ===================================================== */

    function changeDate(days) {

      if (!selectedDate.value) {

        setToday();

      }


      const date =
        new Date(
          `${selectedDate.value}T00:00:00`
        );


      date.setDate(
        date.getDate() + days
      );


      const year =
        date.getFullYear();


      const month =
        String(
          date.getMonth() + 1
        ).padStart(2, "0");


      const day =
        String(
          date.getDate()
        ).padStart(2, "0");


      selectedDate.value =
        `${year}-${month}-${day}`;


      loadBookings();

    }


    /* =====================================================
       ФОРМАТ ДАТЫ
    ===================================================== */

    function formatDate(dateString) {

      if (!dateString) {

        return "";

      }


      const parts =
        dateString.split("-");


      if (parts.length !== 3) {

        return dateString;

      }


      return (
        `${parts[2]}.` +
        `${parts[1]}.` +
        `${parts[0]}`
      );

    }


    /* =====================================================
       НАЗВАНИЕ ДНЯ
    ===================================================== */

    function formatDayTitle(dateString) {

      const date =
        new Date(
          `${dateString}T00:00:00`
        );


      const weekdays = [

        "воскресенье",
        "понедельник",
        "вторник",
        "среда",
        "четверг",
        "пятница",
        "суббота"

      ];


      return (
        `${formatDate(dateString)} — ` +
        `${weekdays[date.getDay()]}`
      );

    }


    /* =====================================================
       ОШИБКА
    ===================================================== */

    function showError(message) {

      errorElement.textContent =
        message;

      errorElement.style.display =
        "block";

    }


    function hideError() {

      errorElement.style.display =
        "none";

    }


    /* =====================================================
       ЗАГРУЗКА
    ===================================================== */

    async function loadBookings() {

      hideError();


      bookingsContainer.innerHTML = `

      <div class="loading">
        ⏳ Загружаем записи...
      </div>

    `;


      try {

        const response =
          await fetch(
            GOOGLE_SCRIPT_URL +
            "?t=" +
            Date.now()
          );


        if (!response.ok) {

          throw new Error(
            "Ошибка загрузки данных"
          );

        }


        const bookings =
          await response.json();


        if (!Array.isArray(bookings)) {

          throw new Error(
            "Google Apps Script вернул неправильный ответ"
          );

        }


        const date =
          selectedDate.value;


        /*
         * Только выбранный день.
         *
         * "Новая" игнорируется.
         */

        const dayBookings =
          bookings.filter(
            booking => {

              const bookingDate =
                String(
                  booking.date || ""
                ).trim();


              const status =
                String(
                  booking.status || ""
                )
                  .trim()
                  .toLowerCase();


              if (status === "новая") {

                return false;

              }


              return bookingDate === date;

            }
          );


        /*
         * Активные
         */

        const activeBookings =
          dayBookings.filter(
            booking => {

              const status =
                String(
                  booking.status || ""
                )
                  .trim()
                  .toLowerCase();


              return status === "активна";

            }
          );


        /*
         * Отменённые
         */

        const cancelledBookings =
          dayBookings.filter(
            booking => {

              const status =
                String(
                  booking.status || ""
                )
                  .trim()
                  .toLowerCase();


              return status === "отменена";

            }
          );


        /*
         * Занятое время
         */

        const busyTimes =
          new Set();


        activeBookings.forEach(
          booking => {

            const time =
              String(
                booking.time || ""
              )
                .trim()
                .substring(0, 5);


            if (time) {

              busyTimes.add(time);

            }

          }
        );


        bookingsContainer.innerHTML =
          "";


        /*
         * День
         */

        const dayElement =
          document.createElement(
            "div"
          );


        const dayTitle =
          document.createElement(
            "div"
          );


        dayTitle.className =
          "day-title";


        dayTitle.textContent =
          "📅 " +
          formatDayTitle(date);


        dayElement.appendChild(
          dayTitle
        );


        const bookingList =
          document.createElement(
            "div"
          );


        bookingList.className =
          "booking-list";


        /*
         * =================================================
         * АКТИВНЫЕ
         * =================================================
         */

        WORK_TIMES.forEach(
          time => {

            const booking =
              activeBookings.find(
                item => {

                  const itemTime =
                    String(
                      item.time || ""
                    )
                      .trim()
                      .substring(0, 5);


                  return itemTime === time;

                }
              );


            if (booking) {

              bookingList.appendChild(
                createActiveCard(
                  booking
                )
              );

            }

          }
        );


        /*
         * =================================================
         * ОТМЕНЁННЫЕ
         * =================================================
         */

        WORK_TIMES.forEach(
          time => {

            if (
              busyTimes.has(time)
            ) {

              return;

            }


            const booking =
              cancelledBookings.find(
                item => {

                  const itemTime =
                    String(
                      item.time || ""
                    )
                      .trim()
                      .substring(0, 5);


                  return itemTime === time;

                }
              );


            if (booking) {

              bookingList.appendChild(
                createCancelledCard(
                  booking
                )
              );

            }

          }
        );


        /*
         * =================================================
         * СВОБОДНЫЕ
         * =================================================
         */

        WORK_TIMES.forEach(
          time => {

            if (
              busyTimes.has(time)
            ) {

              return;

            }


            const hasCancelled =
              cancelledBookings.some(
                booking => {

                  const itemTime =
                    String(
                      booking.time || ""
                    )
                      .trim()
                      .substring(0, 5);


                  return itemTime === time;

                }
              );


            /*
             * Если была отменённая запись,
             * отдельный "Свободно" не создаём,
             * потому что выше уже показали
             * отменённую запись с кнопкой.
             */

            if (!hasCancelled) {

              bookingList.appendChild(
                createFreeCard(
                  time
                )
              );

            }

          }
        );


        dayElement.appendChild(
          bookingList
        );


        bookingsContainer.appendChild(
          dayElement
        );


        /*
         * =================================================
         * СТАТИСТИКА
         * =================================================
         */

        const totalActive =
          activeBookings.length;


        const totalCancelled =
          cancelledBookings.filter(
            booking => {

              const time =
                String(
                  booking.time || ""
                )
                  .trim()
                  .substring(0, 5);


              return !busyTimes.has(
                time
              );

            }
          ).length;


        const totalFree =
          WORK_TIMES.filter(
            time =>
              !busyTimes.has(time)
          ).length;


        activeCount.textContent =
          totalActive;


        freeCount.textContent =
          totalFree;


        cancelledCount.textContent =
          totalCancelled;


      } catch (error) {

        console.error(error);


        bookingsContainer.innerHTML =
          "";


        showError(
          "Ошибка загрузки записей: " +
          error.message
        );

      }

    }


    /* =====================================================
       АКТИВНАЯ КАРТОЧКА
    ===================================================== */

    function createActiveCard(
      booking
    ) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "booking active-booking";


      const time =
        String(
          booking.time || ""
        )
          .trim()
          .substring(0, 5);


      card.innerHTML = `

      <div class="booking-time">
        🟢 ${time}
      </div>


      <div class="booking-info">

        <div>
          <strong>Имя:</strong>
          ${escapeHtml(booking.name)}
        </div>


        <div>
          <strong>Телефон:</strong>
          ${escapeHtml(booking.phone)}
        </div>


        <div>
          <strong>Telegram:</strong>
          ${escapeHtml(booking.telegram)}
        </div>


        <div>
          <strong>Услуга:</strong>
          ${escapeHtml(booking.service)}
        </div>


        <div>
          <strong>Комментарий:</strong>
          ${escapeHtml(booking.comment)}
        </div>


        <div>
          <strong>Статус:</strong>
          🟢 Активна
        </div>

      </div>


      <button
        class="cancel-button"
      >
        ❌ Отменить запись
      </button>

    `;


      const cancelButton =
        card.querySelector(
          ".cancel-button"
        );


      cancelButton.addEventListener(
        "click",
        async () => {

          const confirmed =
            confirm(
              `Отменить запись?\n\n` +
              `Время: ${time}\n` +
              `Клиент: ${booking.name}`
            );


          if (!confirmed) {

            return;

          }


          await cancelBooking(
            booking.id
          );

        }
      );


      return card;

    }


    /* =====================================================
       ОТМЕНЁННАЯ КАРТОЧКА
    ===================================================== */

    function createCancelledCard(
      booking
    ) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "booking cancelled-booking";


      const time =
        String(
          booking.time || ""
        )
          .trim()
          .substring(0, 5);


      card.innerHTML = `

      <div class="booking-time">
        🔴 ${time}
      </div>


      <div class="booking-info">

        <div>
          <strong>Имя:</strong>
          ${escapeHtml(booking.name)}
        </div>


        <div>
          <strong>Телефон:</strong>
          ${escapeHtml(booking.phone)}
        </div>


        <div>
          <strong>Услуга:</strong>
          ${escapeHtml(booking.service)}
        </div>


        <div class="cancelled">
          🔴 Отменена — время свободно
        </div>


        <button
          class="add-booking-button"
        >
          ➕ Добавить запись
        </button>

      </div>

    `;


      const addButton =
        card.querySelector(
          ".add-booking-button"
        );


      addButton.addEventListener(
        "click",
        () => {

          openBookingModal(
            selectedDate.value,
            time
          );

        }
      );


      return card;

    }


    /* =====================================================
       СВОБОДНОЕ ВРЕМЯ
    ===================================================== */

    function createFreeCard(
      time
    ) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "booking free-booking";


      card.innerHTML = `

      <div class="booking-time">
        🟡 ${time}
      </div>


      <div class="free">
        🟡 Свободно
      </div>


      <button
        class="add-booking-button"
      >
        ➕ Добавить запись
      </button>

    `;


      const addButton =
        card.querySelector(
          ".add-booking-button"
        );


      addButton.addEventListener(
        "click",
        () => {

          openBookingModal(
            selectedDate.value,
            time
          );

        }
      );


      return card;

    }


    /* =====================================================
       ОТКРЫТЬ ФОРМУ НОВОЙ ЗАПИСИ
    ===================================================== */

    function openBookingModal(
      date,
      time
    ) {

      bookingDate.value =
        date;


      bookingTime.innerHTML =
        `
        <option value="">
          Выберите время
        </option>
      `;


      WORK_TIMES.forEach(
        workTime => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            workTime;


          option.textContent =
            workTime;


          bookingTime.appendChild(
            option
          );

        }
      );


      bookingTime.value =
        time;


      bookingName.value =
        "";


      bookingPhone.value =
        "";


      bookingTelegram.value =
        "";


      bookingService.value =
        "";


      bookingComment.value =
        "";


      modalError.textContent =
        "";


      modalError.style.display =
        "none";


      bookingModal.classList.add(
        "active"
      );


      bookingName.focus();

    }


    /* =====================================================
       ЗАКРЫТЬ MODAL
    ===================================================== */

    function closeBookingModal() {

      bookingModal.classList.remove(
        "active"
      );

    }


    /* =====================================================
       СОЗДАТЬ ЗАПИСЬ
    ===================================================== */

    async function saveBooking() {

      modalError.style.display =
        "none";


      const date =
        bookingDate.value.trim();


      const time =
        bookingTime.value.trim();


      const name =
        bookingName.value.trim();


      const phone =
        bookingPhone.value.trim();


      const telegram =
        bookingTelegram.value.trim();


      const service =
        bookingService.value.trim();


      const comment =
        bookingComment.value.trim();


      /*
       * Проверки
       */

      if (!date) {

        showModalError(
          "Выберите дату."
        );

        return;

      }


      if (!time) {

        showModalError(
          "Выберите время."
        );

        return;

      }


      if (!name) {

        showModalError(
          "Введите имя клиента."
        );

        return;

      }


      if (!phone) {

        showModalError(
          "Введите телефон."
        );

        return;

      }


      // Проверяем белорусский номер

      const phoneDigits =
        phone.replace(/\D/g, "");


      if (
        phoneDigits.length !== 12 ||
        !phoneDigits.startsWith("375")
      ) {

        showModalError(
          "Введите телефон в формате +375 (XX) XXX-XX-XX"
        );

        bookingPhone.focus();

        return;

      }


      if (!service) {

        showModalError(
          "Выберите услугу."
        );

        return;

      }


      /*
       * Блокируем кнопку
       */

      saveBookingButton.disabled =
        true;


      saveBookingButton.textContent =
        "Сохраняем...";


      try {


        const response =
          await fetch(
            GOOGLE_SCRIPT_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body: JSON.stringify({

                action:
                  "addAdminBooking",

                date:
                  date,

                time:
                  time,

                name:
                  name,

                phone:
                  phone,

                telegram:
                  telegram,

                service:
                  service,

                comment:
                  comment

              })

            }
          );


        if (!response.ok) {

          throw new Error(
            "Ошибка отправки записи"
          );

        }


        const result =
          await response.json();


        console.log(
          "Ответ создания:",
          result
        );


        if (
          result.success === false
        ) {

          throw new Error(
            result.error ||
            "Не удалось создать запись"
          );

        }


        /*
         * Закрываем форму
         */

        closeBookingModal();


        /*
         * Обновляем админку
         */

        await loadBookings();


        alert(
          "✅ Запись успешно добавлена"
        );


      } catch (error) {

        console.error(error);


        showModalError(
          error.message
        );


      } finally {

        saveBookingButton.disabled =
          false;


        saveBookingButton.textContent =
          "Создать запись";

      }

    }


    /* =====================================================
       ОШИБКА В MODAL
    ===================================================== */

    function showModalError(
      message
    ) {

      modalError.textContent =
        message;


      modalError.style.display =
        "block";

    }


    /* =====================================================
       ОТМЕНА ЗАПИСИ
    ===================================================== */

    async function cancelBooking(id) {

      try {


        const response =
          await fetch(
            GOOGLE_SCRIPT_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body: JSON.stringify({

                action:
                  "cancelAdminBooking",

                id:
                  id

              })

            }
          );


        if (!response.ok) {

          throw new Error(
            "Ошибка запроса"
          );

        }


        const result =
          await response.json();


        if (
          result.success === false
        ) {

          throw new Error(
            result.error ||
            "Не удалось отменить запись"
          );

        }


        alert(
          "Запись отменена"
        );


        await loadBookings();


      } catch (error) {

        console.error(error);


        alert(
          "Ошибка отмены записи:\n" +
          error.message
        );

      }

    }


    /* =====================================================
       ЗАЩИТА HTML
    ===================================================== */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       КНОПКИ ДАТЫ
    ===================================================== */

    previousDayButton.addEventListener(
      "click",
      () => {

        changeDate(-1);

      }
    );


    todayButton.addEventListener(
      "click",
      () => {

        setToday();

        loadBookings();

      }
    );


    nextDayButton.addEventListener(
      "click",
      () => {

        changeDate(1);

      }
    );


    /* =====================================================
       КАЛЕНДАРЬ
    ===================================================== */

    selectedDate.addEventListener(
      "change",
      () => {

        loadBookings();

      }
    );


    /* =====================================================
       ОБНОВИТЬ
    ===================================================== */

    refreshButton.addEventListener(
      "click",
      () => {

        loadBookings();

      }
    );


    /* =====================================================
       MODAL КНОПКИ
    ===================================================== */

    closeModalButton.addEventListener(
      "click",
      () => {

        closeBookingModal();

      }
    );


    saveBookingButton.addEventListener(
      "click",
      () => {

        saveBooking();

      }
    );


    /*
     * Закрытие по клику
     * вне окна
     */

    bookingModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          bookingModal
        ) {

          closeBookingModal();

        }

      }
    );


    /*
     * Закрытие клавишей Escape
     */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeBookingModal();

        }

      }
    );

    bookingPhone.addEventListener("input", () => {

      let value = bookingPhone.value.replace(/\D/g, "");

      // Если пользователь ввёл 8XXXXXXXXXX
      if (value.startsWith("8")) {
        value = "375" + value.substring(1);
      }

      // Если начал ввод не с 375
      if (!value.startsWith("375")) {
        value = "375" + value;
      }

      value = value.substring(0, 12);

      let result = "+375";

      if (value.length > 3) {
        result += " (" + value.substring(3, 5);
      }

      if (value.length >= 5) {
        result += ") ";
      }

      if (value.length > 5) {
        result += value.substring(5, 8);
      }

      if (value.length > 8) {
        result += "-" + value.substring(8, 10);
      }

      if (value.length > 10) {
        result += "-" + value.substring(10, 12);
      }

      bookingPhone.value = result;

    });
    /* =====================================================
       ЗАПУСК
    ===================================================== */

    setToday();

    loadBookings();


  </script>
